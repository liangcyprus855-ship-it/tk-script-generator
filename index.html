    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc) desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set) {
            var val = desc.get ? desc.get.call(window) : desc.value;
            Object.defineProperty(window, 'fetch', {
              get: function() { return val; },
              set: function(v) { val = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch(e) {}
      })();
    </script>
