name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  cloud-transactions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: tk_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix la02-api
      - run: node --test la02-api/*.test.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: acceptance-only
          PGDATABASE: tk_test
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build web and backend
        run: npm run build:commercial
      - name: Build Windows NSIS installer
        run: npm run desktop:pack
      - name: Check cloud-only UI and balance gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs | Out-Null
          $testProcess = Start-Process -FilePath node_modules/electron/dist/electron.exe -ArgumentList 'scripts/cloud-ui-smoke.cjs' -WindowStyle Hidden -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) { Get-Content outputs/cloud-ui-smoke.json -ErrorAction SilentlyContinue; throw 'Cloud UI check failed' }
          $result = Get-Content outputs/cloud-ui-smoke.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Cloud UI acceptance failed' }
      - name: Test packaged startup and shutdown
        run: node scripts/smoke.cjs
      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/TK-Script-Generator-Setup-$version.exe"
          if ($installer.Length -lt 50000000) { throw 'Installer unexpectedly small' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'latest.yml missing' }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'blockmap missing' }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TK-Script-Generator-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - cloud-transactions
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: TK-Script-Generator-Windows
          path: release
      - name: Publish versioned release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          installer="release/TK-Script-Generator-Setup-${version}.exe"
          test -s "$installer"
          test -s "release/latest.yml"
          test -s "${installer}.blockmap"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
              "$installer" "${installer}.blockmap" release/latest.yml --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "${version} Windows 安装包" --notes-file release-notes.md --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "${version} Windows 安装包" --notes-file release-notes.md --latest \
              "$installer" "${installer}.blockmap" release/latest.yml
          fi
