name: Build Windows Installer
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build web and backend
        run: npm run build
      - name: Build Windows NSIS installer
        run: npm run desktop:pack
      - name: Test packaged startup and shutdown
        run: node scripts/smoke.cjs
      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/TK-Script-Generator-Setup-$version.exe"
          if ($installer.Length -lt 50000000) { throw 'Installer unexpectedly small' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'latest.yml missing' }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'blockmap missing' }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TK-Script-Generator-Windows-1.0.3
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
